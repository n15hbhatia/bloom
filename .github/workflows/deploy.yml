name: Deploy BLOOM to GitHub Pages

# Builds the app and publishes /dist to the `gh-pages` branch.
# GitHub Pages serves that branch (Settings → Pages → Source: "Deploy from a branch", branch: gh-pages, folder: / (root)).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Serves the app from https://<user>.github.io/<repo-name>/
          # For a user/organisation site (<user>.github.io) or a custom domain, change this to "/".
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy BLOOM'
